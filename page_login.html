<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登录 · 燃冰</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a3a5c 0%, #2d5a8a 50%, #e86a3a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .logo-area {
      text-align: center;
      margin-bottom: 40px;
    }
    .logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #e86a3a, #f0a06a);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      font-size: 36px;
    }
    .logo-title {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 2px;
    }
    .logo-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.65);
      margin-top: 4px;
      letter-spacing: 1px;
    }
    .login-card {
      background: #fff;
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    .login-title {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
      text-align: center;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 16px;
    }
    .input-label {
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
      display: block;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    .input-field {
      flex: 1;
      height: 46px;
      border: 1.5px solid #e8e8e8;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      background: #fafafa;
    }
    .input-field:focus {
      border-color: #e86a3a;
      background: #fff;
    }
    .btn-code {
      height: 46px;
      padding: 0 14px;
      background: linear-gradient(135deg, #1a3a5c, #2d5a8a);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      min-width: 90px;
    }
    .btn-code:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-login {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #e86a3a, #f0a06a);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      letter-spacing: 1px;
    }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-login:active:not(:disabled) {
      transform: scale(0.98);
    }
    .error-msg {
      background: #fff2f0;
      border: 1px solid #ffccc7;
      color: #cf1322;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 14px;
      display: none;
    }
    .error-msg.show { display: block; }
    .demo-hint {
      margin-top: 20px;
      padding: 14px;
      background: #f0f7ff;
      border-radius: 12px;
      font-size: 12px;
      color: #555;
      line-height: 1.7;
    }
    .demo-hint strong {
      color: #1a3a5c;
    }
    .skip-btn {
      display: block;
      margin: 16px auto 0;
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="logo-area">
    <div class="logo">❄️</div>
    <div class="logo-title">燃冰</div>
    <div class="logo-sub">AI 商务社交平台</div>
  </div>

  <div class="login-card">
    <div class="login-title">手机号登录</div>

    <div id="errorBox" class="error-msg"></div>

    <div class="input-group">
      <label class="input-label">手机号</label>
      <input type="tel" id="phoneInput" class="input-field" placeholder="请输入手机号" maxlength="11" autocomplete="tel">
    </div>

    <div class="input-group">
      <label class="input-label">验证码</label>
      <div class="input-row">
        <input type="text" id="codeInput" class="input-field" placeholder="请输入验证码" maxlength="6" autocomplete="off">
        <button class="btn-code" id="sendCodeBtn" onclick="sendCode()">发送验证码</button>
      </div>
    </div>

    <button class="btn-login" id="loginBtn" onclick="doLogin()">登录</button>

    <div class="demo-hint">
      <strong>测试账号：</strong><br>
      手机号：13800138001<br>
      验证码：123456（任何6位数字均可）
    </div>
  </div>

  <button class="skip-btn" onclick="skipLogin()">跳过登录，直接浏览</button>

<script>
var API_BASE = 'http://localhost:8899/api/v1';
var countdown = 0;

function $(id) { return document.getElementById(id); }

function showError(msg) {
  var el = $('errorBox');
  el.textContent = msg;
  el.classList.add('show');
}
function clearError() {
  $('errorBox').classList.remove('show');
}

function sendCode() {
  var phone = $('phoneInput').value.trim();
  if (!phone || phone.length < 11) {
    showError('请输入正确的11位手机号');
    return;
  }
  clearError();
  var btn = $('sendCodeBtn');
  btn.disabled = true;
  btn.textContent = '发送中...';
  fetch(API_BASE + '/auth/login/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone: phone, code: '123456' })
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.token) {
      localStorage.setItem('ranbing_token', data.token);
      localStorage.setItem('ranbing_phone', phone);
      window.location.href = 'page_P_home.html';
    } else {
      showError(data.detail || data.non_field_errors ?.[0] || '发送失败');
      btn.disabled = false;
      btn.textContent = '发送验证码';
    }
  }).catch(function() {
    showError('网络错误，请检查后端服务是否启动');
    btn.disabled = false;
    btn.textContent = '发送验证码';
  });
}

function doLogin() {
  var phone = $('phoneInput').value.trim();
  var code = $('codeInput').value.trim();
  if (!phone || phone.length < 11) { showError('请输入正确的11位手机号'); return; }
  if (!code || code.length < 4) { showError('请输入验证码'); return; }
  clearError();
  var btn = $('loginBtn');
  btn.disabled = true;
  btn.textContent = '登录中...';
  fetch(API_BASE + '/auth/login/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone: phone, code: code })
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.token) {
      localStorage.setItem('ranbing_token', data.token);
      localStorage.setItem('ranbing_phone', phone);
      window.location.href = 'page_P_home.html';
    } else {
      showError(data.detail || data.non_field_errors?.[0] || '登录失败，请检查验证码');
      btn.disabled = false;
      btn.textContent = '登录';
    }
  }).catch(function() {
    showError('网络错误，请检查后端服务是否启动 (localhost:8899)');
    btn.disabled = false;
    btn.textContent = '登录';
  });
}

function skipLogin() {
  localStorage.removeItem('ranbing_token');
  window.location.href = 'page_P_home.html';
}

// 回车登录
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

// 自动填充测试账号（方便演示）
$('phoneInput').value = '13800138001';
$('codeInput').value = '123456';
</script>

</body>
</html>
