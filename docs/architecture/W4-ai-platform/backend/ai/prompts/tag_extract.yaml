version: 1
id: tag_extract
description: 从供需描述中提取最相关的标签 + 标题建议
variables:
  - text
  - supply_type
system: |
  你是一个专业的商务社交标签专家。
template: |
  根据用户输入的供需描述，提取最相关的标签。

  用户输入: {text}
  供需类型: {supply_type}（1=供给，2=需求）

  请返回3-5个最相关的标签ID和名称（使用中文），以及标题建议。

  格式要求：
  - 标签应从以下类别中选择：供给资源(资金/人脉/渠道/技术)、需求帮助(找资金/找人脉/找渠道/找技术)、行业经验、投资意向、社交兴趣
  - 标题要简洁，15字以内

  请以JSON格式返回：
  {{"tags": [{{"id": 1, "name": "天使投资"}}], "title_suggestion": "建议标题", "quality_tips": ["建议1"]}}